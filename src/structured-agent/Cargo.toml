[package]
name = "structured-agent"
version = "0.2.0"
edition = "2024"
license.workspace = true
repository = "https://github.com/wigmorewelsh/structured-agent"
description = "A structured agent for working with code and AI models"
homepage = "https://github.com/wigmorewelsh/structured-agent"

[[bin]]
name = "structured-agent"
path = "src/main.rs"



[dependencies]
structured-agent-ast = { path = "../structured-agent-ast" }
structured-agent-gemini = { path = "../structured-agent-gemini" }
structured-agent-openai = { path = "../structured-agent-openai" }
structured-agent-bytecode-compiler = { path = "../structured-agent-bytecode-compiler" }
structured-agent-il = { path = "../structured-agent-il" }
structured-agent-vm = { path = "../structured-agent-vm" }
structured-agent-interpreter-runtime = { path = "../structured-agent-interpreter-runtime" }
structured-agent-il-analysis = { path = "../structured-agent-il-analysis" }
structured-agent-typed-ast = { path = "../structured-agent-typed-ast" }
structured-agent-typecheck = { path = "../structured-agent-typecheck" }
structured-agent-analysis = { path = "../structured-agent-analysis" }
structured-agent-parser = { path = "../structured-agent-parser" }
structured-agent-runtime = { path = "../structured-agent-runtime" }
structured-agent-stdlib = { path = "../structured-agent-stdlib" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
codespan-reporting = "0.11"
combine = "4.6.7"
nonempty = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = { version = "2.4", features = ["serde"] }
rmcp = { version = "0.15", features = ["client", "transport-child-process", "macros"] }
dashmap = "6.1.0"
salsa = "0.26.0"
arrow = { version = "57.2.0", default-features = false }
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
agent-client-protocol = "0.10.4"
agent-client-protocol-schema = "0.10.8"
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.0"
rstest = "0.18"
structured-agent-runtime = { path = "../structured-agent-runtime" }
structured-agent-macros = { path = "../structured-agent-macros" }

[package.metadata.release]
pre-release-replacements = [
  {file="../../pyproject.toml", search="version = \".*\"", replace="version = \"{{version}}\"", exactly=1},
]
