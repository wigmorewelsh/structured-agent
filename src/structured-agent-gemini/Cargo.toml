[package]
name = "structured-agent-gemini"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
structured-agent-interpreter-runtime = { path = "../structured-agent-interpreter-runtime" }
structured-agent-runtime = { path = "../structured-agent-runtime" }
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.4", features = ["serde"] }
schemars = "0.8"
tokio = { version = "1.0", features = ["sync", "time", "process"] }
arrow = { version = "57.2.0", default-features = false }

[dev-dependencies]
nonempty = "0.10"
