[package]
name = "structured-agent-openai"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
structured-agent-interpreter-runtime = { path = "../structured-agent-interpreter-runtime" }
structured-agent-runtime = { path = "../structured-agent-runtime" }
async-openai = { version = "0.36.1", features = ["chat-completion"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = { version = "57.2.0", default-features = false }
base64 = "0.22"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["sync"] }

[dev-dependencies]
nonempty = "0.10"
wiremock = "0.6"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
