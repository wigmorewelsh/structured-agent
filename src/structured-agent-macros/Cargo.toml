[package]
name = "structured-agent-macros"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
structured-agent-runtime = { path = "../structured-agent-runtime" }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
